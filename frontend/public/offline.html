<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5ed7" />
    <title>OMECOnnect – No internet</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif; color: #17212b; background: #eef5ff; }
      main { max-width: 340px; width: 100%; background: #fff; border-radius: 18px; padding: 28px 22px;
        text-align: center; box-shadow: 0 18px 48px rgba(11, 94, 215, 0.12); }
      .icon { font-size: 44px; }
      h1 { font-size: 1.25rem; margin: 10px 0 8px; }
      p { color: #617085; font-size: 0.95rem; line-height: 1.5; margin: 0 0 18px; }
      a { display: block; background: #0b5ed7; color: #fff; text-decoration: none; font-weight: 700;
        border-radius: 12px; padding: 12px 16px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">📶</div>
      <h1>No internet connection</h1>
      <p>OMECOnnect needs the internet to show your latest bills, alerts and messages.
        Turn on mobile data or Wi-Fi, then try again.</p>
      <a href="/customer-mobile-app/index.html">Try again</a>
    </main>
  </body>
</html>
